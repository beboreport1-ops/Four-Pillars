<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="robots" content="noindex, nofollow">
<title>Page not found &middot; Four Pillars</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0e16;--card:#121a27;--line:#263349;--tx:#e9eef8;--dim:#96a5c0;
  --study:#4f9cf9;--gym:#ff6b4a;--social:#34d399;--soul:#a78bfa;--accent:#4f9cf9;
}
html{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:radial-gradient(140% 60% at 50% -8%,#131c30 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-font-smoothing:antialiased}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;
  width:100%;max-width:380px;text-align:center}
.bars{display:flex;gap:8px;justify-content:center;align-items:flex-end;height:52px;margin-bottom:20px}
.bars i{display:block;width:26px;border-radius:6px}
.bars i:nth-child(1){height:52px;background:var(--study)}
.bars i:nth-child(2){height:36px;background:var(--gym)}
.bars i:nth-child(3){height:44px;background:var(--social)}
.bars i:nth-child(4){height:28px;background:var(--soul)}
h1{font-size:24px;margin-bottom:8px}
p{color:var(--dim);font-size:14px;line-height:1.5;margin-bottom:20px}
a.main{display:block;background:var(--accent);border-radius:10px;padding:12px;color:#fff;
  font-size:15px;font-weight:600;text-decoration:none}
a.main:focus-visible{outline:2px solid #fff;outline-offset:2px}
.code{color:#5d6c87;font-size:12px;margin-top:14px;letter-spacing:.5px}
</style>
</head>
<body>
<main class="box">
  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <h1>Page not found</h1>
  <p>That address does not exist. Everything lives inside the app.</p>
  <a class="main" href="./">Open Four Pillars</a>
  <div class="code">404</div>
</main>
</body>
</html>
