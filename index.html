<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Four Pillars</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0e16;--card:#121a27;--card2:#1a2434;--line:#263349;--line2:#31415c;
  --tx:#e9eef8;--dim:#96a5c0;--faint:#5d6c87;
  --study:#4f9cf9;--gym:#ff6b4a;--social:#34d399;--soul:#a78bfa;
  --study-soft:rgba(79,156,249,.14);--gym-soft:rgba(255,107,74,.14);
  --social-soft:rgba(52,211,153,.14);--soul-soft:rgba(167,139,250,.14);
  --gold:#fbbf24;--accent:#4f9cf9;--accent-fill:#2470d4;--danger:#ef4444;--warn:#f59e0b;--okc:#22c55e;
  --r-s:10px;--r-m:14px;--r-l:18px;--dur:.18s;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.5);
}
html{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:radial-gradient(140% 60% at 50% -8%,#131c30 0%,var(--bg) 55%) fixed,var(--bg);color:var(--tx);min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html[dir=rtl] body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
button{cursor:pointer;font-family:inherit;color:inherit}
.hidden{display:none!important}
#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.authbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:380px}
.authbox h1{font-size:26px;margin-bottom:6px;text-align:center}
.authbox p{color:var(--dim);text-align:center;margin-bottom:20px;font-size:14px}
.authbox input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--tx);font-size:15px;margin-bottom:12px}
.authbox .main{width:100%;background:var(--accent);border:none;border-radius:10px;padding:12px;color:#fff;font-size:15px;font-weight:600}
.authbox .alt{width:100%;background:none;border:none;color:var(--dim);margin-top:10px;font-size:13px}
#authmsg{color:var(--gold);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.langlink{background:none;border:none;color:var(--dim);font-size:12px;font-weight:600;text-decoration:underline;padding:6px;margin-top:4px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,15,23,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header{display:flex;align-items:center;gap:8px;padding:11px 14px}
.lvlbadge{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1200;font-weight:800;border-radius:8px;padding:3px 9px;font-size:12px;white-space:nowrap;flex:0 0 auto}
.xpwrap{flex:1 1 auto;min-width:0}
.xpbar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
.xpbar div{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:6px;transition:width .4s}
.xptxt{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.netbadge{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap;background:var(--card2);flex:0 0 auto}
.netbadge.off{border-color:#ff6b4a;color:#ff6b4a}
.netbadge.pend{border-color:var(--gold);color:var(--gold)}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;flex:0 0 auto}
.mainnav{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mainnav::-webkit-scrollbar{display:none}
.mainnav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:18px;padding:8px 13px;font-size:12px;font-weight:600;white-space:nowrap}
.mainnav button.on{color:var(--tx);background:var(--card2);border-color:var(--accent)}
main{padding:0 16px 90px;max-width:1000px;margin:0 auto}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.section h2{font-size:15px;margin-bottom:12px}
.muted{color:var(--dim);font-size:13px;line-height:1.5}
.quest{background:linear-gradient(135deg,#131a26,#151d30);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.qtop h2{font-size:14px}
.qcount{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
.qchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.qchip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--dim);transition:all .3s}
.qchip .qe{font-size:18px;display:block;filter:grayscale(1);opacity:.5;transition:all .3s}
.qchip.done{color:var(--tx)}
.qchip.done .qe{filter:none;opacity:1;transform:scale(1.1)}
.qbar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:12px}
.qbar div{height:100%;background:linear-gradient(90deg,#a78bfa,#fbbf24);border-radius:4px;transition:width .5s}
.nextpray{font-size:12px;color:var(--soul);text-align:center;margin-bottom:8px;font-weight:600}
.prayrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pray{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;color:var(--dim);font-size:11px;line-height:1.35}
.pray small{display:block;font-size:10px;opacity:.75}
.pray .tm{display:block;font-size:10px;color:var(--gold);font-weight:700}
.pray.done{background:rgba(167,139,250,.18);border-color:var(--soul);color:var(--tx)}
.pray.now{box-shadow:0 0 0 1px var(--gold)}
.pray.future{opacity:.45}
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.subtabs button.on{background:var(--card2);color:var(--tx);border-color:var(--study)}
.cls{display:flex;align-items:flex-start;gap:9px;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:7px;border-inline-start:3px solid var(--study)}
.cls.absent{border-inline-start-color:#ff6b4a;opacity:.72}
.cls.future{opacity:.55}
.cls .ci{flex:1;min-width:0}
.cls .cc{font-size:12px;font-weight:800;color:var(--study);letter-spacing:.2px}
.cls .cnm{font-size:13px;font-weight:600;line-height:1.35;margin-top:1px;overflow-wrap:anywhere}
.cls .cm{font-size:11px;color:var(--dim);margin-top:2px}
.cls .ct{font-size:11px;color:var(--gold);font-weight:700;white-space:nowrap;padding-top:1px}
.cls .cb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;white-space:nowrap;flex:0 0 auto;align-self:center}
.cls .cb.on{background:var(--danger);border-color:var(--danger);color:#fff}
.crow{background:var(--card2);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.crow .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.crow .cn{font-size:13px;font-weight:700}
.crow .cp{font-size:15px;font-weight:800}
.crow .cs{font-size:11px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
.crow .cbar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;margin-top:7px;overflow:hidden}
.crow .cbar div{height:100%;border-radius:3px;transition:width .4s}
.warn{color:#fbbf24;font-weight:700}
.bad{color:#ff6b4a;font-weight:700}
.tt{overflow-x:auto;padding-bottom:4px}
.ttday{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:9px;border-inline-start:3px solid var(--line)}
.ttday.today{border-inline-start-color:var(--gold);box-shadow:0 0 0 1px rgba(245,196,74,.25)}
.ttday .tth{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.ttday .tth b{font-size:14px}
.ttday .tth span{font-size:11px;color:var(--dim)}
.ttday .tth .cnt{margin-inline-start:auto;font-size:11px;color:var(--dim)}
.ttoffday{background:rgba(167,139,250,.12);border-radius:9px;padding:10px;font-size:12px;color:var(--soul);text-align:center}
.stchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.stchips button{flex:1;min-width:64px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 6px;font-size:12px;font-weight:600}
.gcard{background:var(--card2);border-radius:12px;padding:13px;margin-bottom:12px}
.gtop{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.gnum{font-size:30px;font-weight:800;line-height:1}
.gden{font-size:14px;color:var(--dim);font-weight:700}
.gbar{position:relative;height:9px;background:rgba(255,255,255,.07);border-radius:5px;margin-top:10px;overflow:hidden}
.gfill{position:absolute;inset-inline-start:0;top:0;height:100%;border-radius:5px;transition:width .4s}
.gpend{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12),rgba(255,255,255,.12) 4px,transparent 4px,transparent 8px)}
.gnote{font-size:10px;color:var(--dim);margin-top:7px}

/* gym rank */
.rankcard{position:relative;border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center;overflow:hidden}
.rankcard.sm{padding:14px 12px}
.rname{font-size:19px;font-weight:900;letter-spacing:1.5px;margin-top:10px}
.rlp{font-size:11px;color:var(--dim);margin-top:3px;font-weight:600}
.rbar{height:7px;background:rgba(255,255,255,.08);border-radius:4px;margin:11px auto 0;max-width:230px;overflow:hidden}
.rbar div{height:100%;border-radius:4px;transition:width .5s}
.rnext{font-size:11px;color:var(--gold);margin-top:8px;font-weight:700}
.rankempty{background:var(--card2);border-radius:14px;padding:20px;text-align:center}
.rankempty p{color:var(--dim);font-size:13px;margin:0 0 12px}
.badge3{position:relative;display:inline-flex;align-items:center;justify-content:center}
.bhex{position:absolute;inset:0;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center}
.bhex2{position:absolute;inset:22%;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);opacity:.65}
.btier{position:relative;z-index:2;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.badge3 .bwing{position:absolute;top:32%;width:26%;height:16%;background:linear-gradient(90deg,rgba(255,255,255,.45),transparent);border-radius:3px}
.badge3 .bwing.l{inset-inline-start:-18%}
.badge3 .bwing.r{inset-inline-end:-18%;transform:scaleX(-1)}
.sh{font-size:12px;color:var(--dim);margin:14px 0 8px;font-weight:700}
.liftrow{display:flex;align-items:center;gap:11px;background:var(--card2);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer}
.liftrow.empty{opacity:.6}
.liftrow .lem{font-size:22px;width:40px;text-align:center}
.liftrow .li{flex:1;min-width:0}
.liftrow .li b{font-size:13px}
.liftrow .lm{font-size:11px;color:var(--dim);margin-top:2px}
.liftrow .lm .up{color:#34d399;font-weight:700}
.liftrow .lbar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:6px;overflow:hidden}
.liftrow .lbar div{height:100%;border-radius:2px}
.liftrow .lrk{font-size:11px;font-weight:800;text-align:center;white-space:nowrap;line-height:1.3}
.liftrow .lrk span{font-size:9px;color:var(--dim);font-weight:600}
.liftrow .ladd{font-size:20px;color:var(--dim)}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lad{display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.45;font-size:10px;font-weight:700}
.lad.on{opacity:1;transform:scale(1.06)}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;background:var(--card2);border-radius:10px;padding:9px;margin-bottom:6px}
.spark .sb{flex:1;background:linear-gradient(180deg,#60a5fa,#1d4ed8);border-radius:3px 3px 0 0;min-height:4px}
.hrow{display:flex;align-items:center;gap:9px;background:var(--card2);border-radius:9px;padding:9px 11px;margin-bottom:6px;font-size:12px}
.hrow .hd{color:var(--dim);font-size:11px;white-space:nowrap}
.hrow .hw{flex:1}
.hrow .he{color:var(--gold);font-weight:700;white-space:nowrap;font-size:11px}
.hrow .prtag{background:var(--gold);color:#1a1200;border-radius:4px;padding:1px 4px;font-size:9px;font-weight:800}
.hrow .hx{background:none;border:none;color:var(--dim);font-size:17px;padding:0 3px}
.evrow{display:flex;align-items:center;gap:9px;background:var(--card2);border-radius:10px;padding:10px 11px;margin-bottom:7px;border-inline-start:3px solid}
.evrow .ee{font-size:16px;flex:0 0 auto}
.evrow .ei{flex:1;min-width:0}
.evrow .et{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.evrow .em{font-size:11px;color:var(--dim);margin-top:2px}
.evrow .ed{font-size:11px;font-weight:700;white-space:nowrap;text-align:center}
.evrow.done{opacity:.55}
.evrow .sc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.evrow .sc.has{border-color:#34d399;color:#34d399}
.cdhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cdhead .bk{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700}
.cdhead h2{margin:0;font-size:15px;overflow-wrap:anywhere}
.cdhead .cc2{font-size:11px;color:var(--study);font-weight:800}
.srow{display:flex;align-items:center;gap:9px;background:var(--card2);border-radius:9px;padding:9px 11px;margin-bottom:6px}
.srow .si{flex:1;min-width:0;font-size:12px}
.srow .sm{font-size:10px;color:var(--dim);margin-top:2px}
.srow .rm{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.srow .rm.set{border-color:var(--study);color:var(--study)}
.crow.tap{cursor:pointer}
.crow .ttnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ttnav b{flex:1;text-align:center;font-size:13px}
.phero{background:linear-gradient(135deg,#131a26,#161f2e);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.phero:after{content:'';position:absolute;top:-40px;inset-inline-end:-30px;width:130px;height:130px;border-radius:50%;opacity:.11}
.phero .pe{font-size:30px}
.phero h2{font-size:18px;margin:4px 0 2px}
.phero .sub{font-size:12px;color:var(--dim)}
.pstats{display:flex;gap:18px;margin-top:12px}
.pstats div span{display:block}
.pstats .v{font-size:19px;font-weight:800}
.pstats .k{font-size:11px;color:var(--dim)}
.pgoal{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:12px}
.pgoal div{height:100%;border-radius:5px;transition:width .5s}
.pgoaltx{font-size:11px;color:var(--dim);margin-top:5px}
.qadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.qadd button{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:12px;font-weight:600}
.qadd button:active{transform:scale(.96)}
.qadd .pts{color:var(--gold);font-size:11px}
.wkentries{margin-top:2px}
.hcard{background:linear-gradient(135deg,#131a26,#161f2e);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.hcard h2{font-size:14px;margin-bottom:10px}
.wrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.btl{width:30px;height:38px;border:none;background:none;font-size:22px;line-height:1;opacity:.28;filter:grayscale(1);transition:all .2s;padding:0}
.btl.full{opacity:1;filter:none;transform:scale(1.06)}
.wmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:10px}
.wmeta b{color:var(--tx)}
.nutgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.nut{background:var(--card2);border-radius:10px;padding:10px}
.nut .nv{font-size:17px;font-weight:800}
.nut .nl{font-size:11px;color:var(--dim);margin-top:1px}
.nut .nb{height:5px;background:rgba(255,255,255,.07);border-radius:3px;margin-top:7px;overflow:hidden}
.nut .nb div{height:100%;border-radius:3px;transition:width .4s}
.hbtns{display:flex;gap:8px}
.hbtns button{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;font-weight:600}
.goalrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.goalrow .gi{width:96px;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goalrow .tr{flex:1;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.goalrow .tr div{height:100%;border-radius:6px;transition:width .5s}
.goalrow .vl{width:52px;text-align:end;font-size:12px;font-weight:700}
.goalrow.hit .vl{color:var(--gold)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.pcard .em{font-size:22px}
.pcard h3{font-size:14px;margin:6px 0 2px}
.pcard .plvl{font-size:12px;color:var(--dim)}
.pcard .ppts{font-size:20px;font-weight:800;margin-top:4px}
.pcard .pbar{height:6px;background:var(--card2);border-radius:4px;margin-top:8px;overflow:hidden}
.pcard .pbar div{height:100%;border-radius:4px}
.pcard .stk{position:absolute;top:12px;inset-inline-end:12px;font-size:12px;background:var(--card2);border-radius:8px;padding:3px 8px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.mini .big{font-size:24px;font-weight:800}
.mini .lbl{font-size:12px;color:var(--dim);margin-top:2px}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.barrow .nm{width:100px;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .tr{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.barrow .tr div{height:100%;border-radius:7px;transition:width .5s}
.barrow .vl{width:64px;text-align:end;font-size:13px;font-weight:700}
.cmp{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.cmp .nm{width:100px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .tw{flex:1;display:flex;gap:4px;align-items:center}
.cmp .bar{height:10px;border-radius:5px}
.cmp .dl{width:60px;text-align:end;font-weight:700;font-size:12px}
.up{color:#34d399}.down{color:#ff6b4a}.same{color:var(--dim)}
#radar,#seasonring{display:block;margin:0 auto;max-width:100%}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.badge .be{font-size:24px;display:block;margin-bottom:4px}
.badge .bn{font-size:11px;font-weight:600}
.badge .bd{font-size:10px;color:var(--dim);margin-top:2px}
.badge.locked{opacity:.35;filter:grayscale(1)}

/* ============================================================
   DESIGN SYSTEM LAYER - token discipline + interaction states
   Appended last so it wins the cascade at equal specificity.
   Type scale: 10/11/12/13/15/17/20/24/32. Radii: 10/14/18.
   ============================================================ */

/* ---- surfaces ---- */
.section{border-radius:var(--r-l);border-color:var(--line);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.section h2{font-size:15px;font-weight:700;letter-spacing:.2px;margin-bottom:12px}
.sh{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:800}
.topbar{background:rgba(10,14,22,.82);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}

/* ---- stat numerals read as data, not prose ---- */
.lvlbadge,.rv,.he,.lrk,.rlp,.rname,.btier,.cstat,.abspct,.gs,.qn{font-variant-numeric:tabular-nums}

/* ---- nav: pill tabs, real touch targets ---- */
.mainnav{padding:6px 10px 10px;gap:6px}
.mainnav button{min-height:40px;border-radius:999px;padding:8px 14px;font-size:12.5px;transition:background var(--dur),color var(--dur),border-color var(--dur)}
.mainnav button.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;font-weight:700}
.subtabs button{min-height:40px;border-radius:var(--r-s)}

/* ---- buttons: states exist now ---- */
button{transition:background var(--dur),border-color var(--dur),color var(--dur),transform var(--dur),opacity var(--dur)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;pointer-events:none}
.mrow button{min-height:46px;border-radius:var(--r-m);font-weight:700}
.mrow .ok{background:var(--accent-fill);color:#fff}
.mrow .danger{background:var(--danger)}
.menuitem{min-height:48px;border-radius:var(--r-m)}
@media(hover:hover){
  .mainnav button:not(.on):hover{color:var(--tx);border-color:var(--line2)}
  .mrow .ok:hover{filter:brightness(1.1)}
  .mrow .no:hover{color:var(--tx)}
  .liftrow:hover,.menuitem:hover,.crow:hover,.evrow:hover{border-color:var(--line2);background:#1e2a3d}
  .qchip:hover{border-color:var(--line2)}
}

/* ---- keyboard focus: visible everywhere, never for taps ---- */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mbox input:focus-visible,.mbox select:focus-visible,.mbox textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--study-soft)}

/* ---- forms ---- */
.mbox input,.mbox select,.mbox textarea{border-radius:var(--r-s);padding:12px;min-height:46px;font-size:15px;transition:border-color var(--dur),box-shadow var(--dur)}
.mbox label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;margin:12px 0 5px}
.mbox h2{font-size:17px}

/* ---- modal: bottom sheet on phones ---- */
.modal{align-items:flex-end;padding:0}
.mbox{max-width:none;border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;box-shadow:0 -12px 48px rgba(0,0,0,.55)}
.mbox::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 14px}
@media(min-width:640px){
  .modal{align-items:center;padding:16px}
  .mbox{max-width:440px;border-radius:20px;padding:20px}
  .mbox::before{display:none}
}

/* ---- floating action + toast ---- */
#fab{width:56px;height:56px;border-radius:999px;font-size:26px;background:linear-gradient(160deg,#3a8bee,var(--accent-fill));border:none;color:#fff;box-shadow:0 6px 20px rgba(79,156,249,.4),0 2px 6px rgba(0,0,0,.4)}
#toast{border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}

/* ---- rows are comfortable tap targets ---- */
.liftrow{min-height:56px;border:1px solid transparent;border-radius:var(--r-m);transition:border-color var(--dur),background var(--dur)}
.hrow{min-height:44px;border-radius:var(--r-s)}
.hrow .hx{min-width:36px;min-height:36px;font-size:18px}
.crow,.evrow{border-radius:var(--r-m)}
.qchip{border-radius:var(--r-m);transition:border-color var(--dur),color var(--dur)}

/* ---- legibility floor: nothing under 10px ---- */
.hrow .prtag{font-size:10px}
.spark+*{font-size:11px}


/* ---- pixel icon system ---- */
.px{display:inline-block;vertical-align:-2px;flex:0 0 auto}
h2>.px:first-child{vertical-align:-3px;margin-inline-end:3px}
.menuitem>.px:first-child{margin-inline-end:2px}

/* ---- motion respect ---- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

function px(n,sz,style){
  var d=PX[n];if(!d)return '';
  sz=sz||16;
  var o='<svg class="px" width="'+sz+'" height="'+sz+'" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"'+(style?' style="'+style+'"':'')+'>';
  for(var y=0;y<12;y++){var row=d.g[y];
    for(var x=0;x<12;x++){var ch=row[x];if(ch==='.'){continue}
      var run=1;while(x+run<12&&row[x+run]===ch)run++;
      o+='<rect x="'+x+'" y="'+y+'" width="'+run+'" height="1" fill="'+(d.p[ch]||'#f0f')+'"/>';
      x+=run-1;
    }}
  return o+'</svg>';
}

async function init(){
  var s=await sb.auth.getSession();
  if(!s.data.session){renderAuth();return}
  user=s.data.session.user;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await loadAll();
  if(types.length===0&&isOnline()&&!loadFailed)await seed();
  prevLvl=lvlOf(totalXP());
  applyLang();
  if(!cfg.onboarded){onboard(0);return}
  if(isOnline()&&coursesIncomplete())seedCourses().then(function(n){if(n)render()});
  if(isOnline()&&acadEvents.length<MYCAL.length)seedCalendar().then(function(n){if(n)render()});
  render();netBadge();flushQueue(true);
  loadPrayerTimes();
  setInterval(function(){if(isOnline()&&getQ().length)flushQueue(true)},60000);
}

    if(s.latitude!=null){cfg.lat=s.latitude;cfg.lon=s.longitude}

function activeTypes(p){
  var out=[],seen={};
  types.forEach(function(t){
    if(t.pillar!==p||!t.active)return;
    var k=t.name+'|'+t.points;
    if(seen[k])return;
    seen[k]=1;out.push(t);
  });
  return out;
}

var QK='fp_queue',CK='fp_cache';
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
function isOnline(){return navigator.onLine!==false}
function getQ(){try{return JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){return []}}
function setQ(q){localStorage.setItem(QK,JSON.stringify(q));netBadge()}
function enqueue(op){var q=getQ();q.push(op);setQ(q)}
function saveCache(){
  try{localStorage.setItem(CK,JSON.stringify({types:types,entries:entries,notes:notes,quran:quran,gymSets:gymSets,nutri:nutri,courses:courses,csessions:csessions,absences:absences,acadEvents:acadEvents,cevents:cevents,cfg:cfg}))}catch(e){}

function loadCache(){
  try{
    var c=JSON.parse(localStorage.getItem(CK)||'null');
    if(!c)return false;
    types=c.types||[];entries=c.entries||[];notes=c.notes||{};quran=c.quran||[];gymSets=c.gymSets||[];nutri=c.nutri||{};courses=c.courses||[];csessions=c.csessions||[];absences=c.absences||[];acadEvents=c.acadEvents||[];cevents=c.cevents||[];
    if(c.cfg)Object.assign(cfg,c.cfg);
    return true;
  }catch(e){return false}
}
function runOp(op){
  var q=sb.from(op.table);
  if(op.op==='insert')return q.insert(op.rows);
  if(op.op==='update')return q.update(op.patch).eq('id',op.id);
  if(op.op==='delete')return q.delete().eq('id',op.id);
  if(op.op==='upsert')return q.upsert(op.row);
  return Promise.resolve({error:null});
}
var syncing=false;
async function flushQueue(quiet){
  if(syncing||!isOnline()||!user)return;
  var q=getQ();
  if(!q.length){netBadge();return}
  syncing=true;
  var sent=0;
  while(q.length){
    var op=q[0];
    try{
      var r=await runOp(op);
      if(r&&r.error){
        // 23505 = row already exists (already synced) -> drop it
        if(r.error.code==='23505'){q.shift();setQ(q);continue}
        break;
      }
    }catch(e){break}
    q.shift();setQ(q);sent++;
  }
  syncing=false;netBadge();
  if(sent&&!quiet)toast(T('synced',{n:sent}),'cloud');
  return sent;
}
function netBadge(){
  var el=document.getElementById('netbadge');if(!el)return;
  var n=getQ().length;
  if(!isOnline()){el.className='netbadge off';el.innerHTML=px('bolt',11)+' '+T('offline')+(n?' \u00B7 '+n:'');el.classList.remove('hidden')}
  else if(n){el.className='netbadge pend';el.textContent='\u21BB '+T('pending',{n:n});el.classList.remove('hidden')}
  else el.classList.add('hidden');
}
/* write wrappers: apply locally always, sync now or later */
async function dbInsert(table,rows){
  rows=rows.map(function(r){return Object.assign({id:uuid(),user_id:user?user.id:null},r)});
  if(isOnline()){
    var r=await sb.from(table).insert(rows).select();
    if(!r.error)return{data:r.data||rows,offline:false};
  }
  enqueue({op:'insert',table:table,rows:rows});
  return{data:rows,offline:true};
}
async function dbUpdate(table,id,patch){
  if(isOnline()){
    var r=await sb.from(table).update(patch).eq('id',id);
    if(!r.error)return{offline:false};
  }
  enqueue({op:'update',table:table,id:id,patch:patch});
  return{offline:true};
}
async function dbDelete(table,id){
  // if the row was created offline and never synced, just drop its queued insert
  var q=getQ(),found=false;
  q.forEach(function(op){
    if(op.op==='insert'&&op.table===table){
      var before=op.rows.length;
      op.rows=op.rows.filter(function(r){return r.id!==id});
      if(op.rows.length<before)found=true;
    }
  });
  if(found){setQ(q.filter(function(op){return op.op!=='insert'||op.rows.length}));return{offline:true}}
  if(isOnline()){
    var r=await sb.from(table).delete().eq('id',id);
    if(!r.error)return{offline:false};
  }
  enqueue({op:'delete',table:table,id:id});
  return{offline:true};
}
async function dbUpsert(table,row){
  if(isOnline()){
    var r=await sb.from(table).upsert(row);
    if(!r.error)return{offline:false};
  }
  // collapse repeated upserts of the same row
  var q=getQ(),key=table==='settings'?'user_id':'entry_date';
  q=q.filter(function(op){return !(op.op==='upsert'&&op.table===table&&op.row[key]===row[key])});
  q.push({op:'upsert',table:table,row:row});setQ(q);
  return{offline:true};
}

/* ---------- prayer times ---------- */
/* everything below crosses a trust boundary: third-party API responses and
   localStorage (which a local attacker or an old bad write could poison). */
function numOrNull(v){
  if(v===null||v===undefined||v==='')return null;   /* Number(null) is 0 - don't let that pass */
  var n=Number(v);return isFinite(n)?n:null;
}
function validCoord(lat,lon){
  return lat!=null&&lon!=null&&Math.abs(lat)<=90&&Math.abs(lon)<=180;
}
function cleanText(v,max){
  if(typeof v!=='string')return '';
  return v.replace(/[<>"'`\\]/g,'').slice(0,max||60).trim();
}
function validTime(v){return typeof v==='string'&&/^([01]?\d|2[0-3]):[0-5]\d$/.test(v.trim())}
function validTz(v){return typeof v==='string'&&/^[A-Za-z0-9_+\-\/]{1,40}$/.test(v)}
async function detectLocation(silent){
  try{
    var r=await fetch('https://ipwho.is/');
    var j=await r.json();
    if(j&&j.success){
      var la=numOrNull(j.latitude),lo=numOrNull(j.longitude);
      if(!validCoord(la,lo)){if(!silent)toast(T('locfail'));return false}
      var patch={city:cleanText(j.city)||cfg.city,country:cleanText(j.country)||cfg.country,lat:la,lon:lo};
      cfg.lat=patch.lat;cfg.lon=patch.lon;
      localStorage.setItem('fp_geo',JSON.stringify({lat:patch.lat,lon:patch.lon,city:patch.city,country:patch.country}));
      if(user)await saveCfg({city:patch.city,country:patch.country});
      if(!silent)toast(patch.city+', '+patch.country,'pin');
      return true;
    }
  }catch(e){}
  if(!silent)toast(T('locfail'));
  return false;
}
function gpsLocate(){
  if(!navigator.geolocation){toast(T('locfail'));return}
  toast('...','pin');
  navigator.geolocation.getCurrentPosition(async function(pos){
    var gl=numOrNull(pos.coords.latitude),gn=numOrNull(pos.coords.longitude);
    if(!validCoord(gl,gn)){toast(T('locfail'));return}
    cfg.lat=gl;cfg.lon=gn;
    localStorage.setItem('fp_geo',JSON.stringify({lat:cfg.lat,lon:cfg.lon,city:cfg.city,country:cfg.country}));
    prayerTimes=null;await loadPrayerTimes(true);
    toast(T('gpsok'),'pin');
  },function(){toast(T('locdenied'))},{timeout:8000});
}
async function loadPrayerTimes(force){
  var geo=null;
  try{geo=JSON.parse(localStorage.getItem('fp_geo')||'null')}catch(e){}
  if(geo){
    var gla=numOrNull(geo.lat),glo=numOrNull(geo.lon);
    if(validCoord(gla,glo)){cfg.lat=gla;cfg.lon=glo}
    else localStorage.removeItem('fp_geo');   /* poisoned cache, drop it */
  }
  if(cfg.lat==null){await detectLocation(true);try{geo=JSON.parse(localStorage.getItem('fp_geo')||'null')}catch(e){}}
  var tag=cfg.lat!=null?(Math.round(cfg.lat*100)+'_'+Math.round(cfg.lon*100)):cfg.city;

      var cp=JSON.parse(c),ok=true;
      PRAYERS.forEach(function(p){if(!validTime(cp[p[0]]))ok=false});
      if(ok){prayerTimes=cp;renderQuest();return}
      localStorage.removeItem(key);
    }catch(e){}}
  }
  try{
    var la=numOrNull(cfg.lat),lo=numOrNull(cfg.lon);
    var u=validCoord(la,lo)
      ?'https://api.aladhan.com/v1/timings?latitude='+encodeURIComponent(la)+'&longitude='+encodeURIComponent(lo)+'&method=4'
      :'https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(cleanText(cfg.city))+'&country='+encodeURIComponent(cleanText(cfg.country))+'&method=4';
    var r=await fetch(u);var j=await r.json();
    if(j&&j.data&&j.data.timings){
      var pt={},bad=false;
      PRAYERS.forEach(function(p){
        var v=(j.data.timings[p[0]]||'').split(' ')[0];   /* API may append " (+03)" */
        if(!validTime(v)){bad=true;return}
        pt[p[0]]=v;
      });

      prayerTimes=pt;
      if(j.data.meta&&validTz(j.data.meta.timezone)){cfg.tz=j.data.meta.timezone;localStorage.setItem('fp_tz',cfg.tz)}
      localStorage.setItem(key,JSON.stringify(prayerTimes));
      renderQuest();
    }
  }catch(e){}
}

function minsNow(){

function toMins(hm){var p=hm.split(':');return parseInt(p[0])*60+parseInt(p[1])}

  var p=hm.split(':'),h=parseInt(p[0],10),m=p[1];

function doneEntries(){return entries.filter(function(e){return e.status==='done'})}

function isFrozen(ds){return !!cfg.freezes[ds]}
function daySet(p){var s={};doneEntries().forEach(function(e){if(!p||e.pillar===p)s[e.entry_date]=1});return s}
function streak(p){
  var s=daySet(p),d=new Date(),n=0;
  if(!s[dstr(d)]&&!isFrozen(dstr(d)))d.setDate(d.getDate()-1);
  while(s[dstr(d)]||isFrozen(dstr(d))){if(s[dstr(d)])n++;d.setDate(d.getDate()-1)}
  return n;
}
function longestStreak(p){
  var s=daySet(p),dates=Object.keys(s).sort();
  if(!dates.length)return 0;
  var best=1,cur=1;
  for(var i=1;i<dates.length;i++){
    var gap=(new Date(dates[i]+'T00:00:00')-new Date(dates[i-1]+'T00:00:00'))/86400000;
    var ok=gap===1;
    if(!ok&&gap>1){ok=true;for(var g=1;g<gap;g++)if(!isFrozen(addDays(dates[i-1],g)))ok=false}
    if(ok){cur++;if(cur>best)best=cur}else cur=1;
  }
  return best;
}
function perfectDaySet(){
  var sets=PKEYS.map(function(p){return daySet(p)}),all={},s={};
  doneEntries().forEach(function(e){all[e.entry_date]=1});
  Object.keys(all).forEach(function(ds){if(sets.every(function(x){return x[ds]}))s[ds]=1});
  return s;
}
function perfectStreak(){
  var s=perfectDaySet(),d=new Date(),n=0;
  if(!s[dstr(d)]&&!isFrozen(dstr(d)))d.setDate(d.getDate()-1);
  while(s[dstr(d)]||isFrozen(dstr(d))){if(s[dstr(d)])n++;d.setDate(d.getDate()-1)}
  return n;
}
function longestPerfect(){
  var s=perfectDaySet(),dates=Object.keys(s).sort();
  if(!dates.length)return 0;
  var best=1,cur=1;
  for(var i=1;i<dates.length;i++){
    var gap=(new Date(dates[i]+'T00:00:00')-new Date(dates[i-1]+'T00:00:00'))/86400000;
    if(gap===1){cur++;if(cur>best)best=cur}else cur=1;
  }
  return best;
}

 {k:'calf_seated',    n:'Seated Calf Raise',            ar:'\u0633\u0645\u0627\u0646\u0629 \u062C\u0644\u0648\u0633',ic:'foot',g:'legs'}

function allLifts(){return LIFTS.concat(ACCESSORIES)}
function liftDef(k){return allLifts().find(function(x){return x.k===k})}
function isRanked(k){return LIFTS.some(function(x){return x.k===k})}
function liftName(k){var l=liftDef(k);return l?(lang==='ar'?l.ar:l.n):k}
function liftIcon(k){var l=liftDef(k);return px(l?l.ic:'barbell',18)}
function rankName(i){return T('rk_'+RANKS[i].k)}
/* Epley, capped: singles stay honest, high reps don't inflate */
function e1RM(w,reps){
  if(!w)return 0;
  var r=Math.max(1,Math.min(12,reps||1));
  if(r===1)return Math.round(w*10)/10;      /* a single IS the 1RM */
  return Math.round(w*(1+r/30)*10)/10;
}
function bodyWeight(){return cfg.body_weight||null}
function sexFactor(){return cfg.lift_sex==='female'?0.72:1}
/* → {idx 0-26, rank 0-8, tier 1-3, lp 0-100, next, needKg} */
function rankOf(liftKey,e1,bw){
  var l=liftDef(liftKey);
  if(!l||!bw||!e1)return null;
  var std=l.std.map(function(x){return x*sexFactor()*bw});
  var ratio=e1;
  if(ratio<std[0]){
    var lp0=Math.max(0,Math.round(ratio/std[0]*100));
    return{rank:0,tier:1,lp:lp0,idx:0,next:std[0],needKg:Math.round((std[0]-ratio)*10)/10,max:false};
  }
  var r=0;
  for(var i=std.length-1;i>=0;i--){if(ratio>=std[i]){r=i;break}}
  if(r===std.length-1){
    var step=(std[r]-std[r-1])/3;            /* keep tier width consistent */
    var over=ratio-std[r];
    var t=Math.min(3,1+Math.floor(over/step));
    var lp=t>=3?100:Math.round((over-step*(t-1))/step*100);
    return{rank:r,tier:t,lp:Math.max(0,Math.min(100,lp)),idx:r*3+t-1,
      next:t<3?std[r]+step*t:null,needKg:t<3?Math.round((std[r]+step*t-ratio)*10)/10:0,max:t>=3};
  }
  var lo=std[r],hi=std[r+1],step=(hi-lo)/3;
  var tier=Math.min(3,Math.floor((ratio-lo)/step)+1);
  var tierLo=lo+step*(tier-1);
  var lp=Math.max(0,Math.min(100,Math.round((ratio-tierLo)/step*100)));
  var nextTarget=tier<3?lo+step*tier:hi;
  return{rank:r,tier:tier,lp:lp,idx:r*3+tier-1,next:nextTarget,
    needKg:Math.round((nextTarget-ratio)*10)/10,max:false};
}
/* best e1RM per lift, from history */
function bestLift(k){
  var rows=gymSets.filter(function(g){return g.exercise===k});
  if(!rows.length)return null;
  var best=null;
  rows.forEach(function(g){
    var e=e1RM(g.weight,g.reps);
    if(!best||e>best.e1)best={e1:e,row:g};
  });
  return best;
}
function liftHistory(k){
  return gymSets.filter(function(g){return g.exercise===k})
    .slice().sort(function(a,b){return a.entry_date<b.entry_date?-1:a.entry_date>b.entry_date?1:0});
}
function loggedLifts(){
  return LIFTS.filter(function(l){return gymSets.some(function(g){return g.exercise===l.k})});
}
/* overall = average tier index across ranked lifts */
function overallRank(){
  var bw=bodyWeight();if(!bw)return null;
  var idxs=[];
  LIFTS.forEach(function(l){
    var b=bestLift(l.k);if(!b)return;
    var r=rankOf(l.k,b.e1,bw);if(r)idxs.push(r.idx);
  });
  if(!idxs.length)return null;
  var avg=idxs.reduce(function(a,b){return a+b},0)/idxs.length;
  var idx=Math.round(avg);
  return{idx:idx,rank:Math.floor(idx/3),tier:idx%3+1,
    lp:Math.round((avg-Math.floor(avg))*100),count:idxs.length};
}

function evTitle(ev){return T('ev_'+ev.kind)||ev.kind}
function evRange(ev){return{a:ev.start_date,b:ev.end_date||ev.start_date}}
function inRange(ds,ev){var r=evRange(ev);return ds>=r.a&&ds<=r.b}
/* is this date cancelled by a holiday / break / exams / vacation? */
function noClassReason(ds){
  for(var i=0;i<acadEvents.length;i++){
    var ev=acadEvents[i];
    if(ev.no_class&&inRange(ds,ev))return evTitle(ev);
  }
  return null;
}
/* last day of regular classes = day before finals start (fallback: +15wk) */
function studyEnd(){
  var ex=acadEvents.find(function(e){return e.kind==='exams'});
  if(ex){var d=new Date(ex.start_date+'T00:00:00');d.setDate(d.getDate()-1);return dstr(d)}
  var f=new Date(semStart()+'T00:00:00');f.setDate(f.getDate()+semWeeks()*7-1);return dstr(f);
}
/* every week-start that actually contains classes (break weeks excluded) */
function studyWeekStarts(){
  var out=[],st=new Date(semStart()+'T00:00:00');
  st.setDate(st.getDate()-st.getDay());
  var end=studyEnd();
  var guard=0;
  while(dstr(st)<=end&&guard++<60){
    var ws=dstr(st),any=false;
    for(var i=0;i<7;i++){
      var d=addDays(ws,i);
      if(d>=semStart()&&d<=end&&!noClassReason(d)){any=true;break}
    }
    if(any)out.push(ws);
    st.setDate(st.getDate()+7);
  }
  return out;
}
function semWeekNum(){
  var ws=studyWeekStarts(),cur=weekStart(new Date());
  var i=ws.indexOf(cur);
  if(i>=0)return i+1;
  var td=today();
  if(td<semStart())return 0;
  for(var j=ws.length-1;j>=0;j--)if(ws[j]<cur)return j+1;
  return 0;
}
function totalStudyWeeks(){return studyWeekStarts().length}
function nextEvent(){
  var td=today(),best=null;
  acadEvents.forEach(function(ev){
    var r=evRange(ev);
    if(r.b>=td&&(!best||r.a<evRange(best).a))best=ev;
  });
  return best;
}
function daysTo(ds){return Math.round((new Date(ds+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)}

/* fills in anything missing; safe to re-run, resumes after an interrupted seed */
async function seedCourses(){
  var added=0;
  for(var i=0;i<MYCOURSES.length;i++){
    var c=MYCOURSES[i];
    var ex=courses.find(function(x){return x.code===c.code});
    if(!ex){
      var r=await dbInsert('courses',[{code:c.code,name:c.name,kind:c.kind,credits:c.credits,sort:c.sort}]);
      ex=r.data[0];courses=courses.concat(r.data);added++;
    }
    var have=csessions.filter(function(x){return x.course_id===ex.id});
    var miss=c.ses.filter(function(x){
      return !have.some(function(h){return h.weekday===x.d&&h.start_time===x.s});
    }).map(function(x){return{course_id:ex.id,activity:x.a,section:x.sec,weekday:x.d,start_time:x.s,end_time:x.e}});
    if(miss.length){
      var r2=await dbInsert('course_sessions',miss);
      csessions=csessions.concat(r2.data);added+=miss.length;
    }
  }
  if(!cfg.courses_seeded)await saveCfg({courses_seeded:true});
  saveCache();
  return added;
}
/* true when the saved schedule doesn't match the expected one */
function coursesIncomplete(){
  for(var i=0;i<MYCOURSES.length;i++){
    var c=MYCOURSES[i];
    var ex=courses.find(function(x){return x.code===c.code});
    if(!ex)return true;
    var have=csessions.filter(function(x){return x.course_id===ex.id});
    if(have.length<c.ses.length)return true;
  }
  return false;
}
function semStart(){return cfg.semester_start||'2026-08-23'}
function semWeeks(){return cfg.semester_weeks||15}
/* all dates a session occurs, across the semester */
function sessionDates(ses){
  var out=[],st=new Date(semStart()+'T00:00:00');
  var base=new Date(st);base.setDate(base.getDate()+((ses.weekday-st.getDay())+7)%7);
  var end=studyEnd(),guard=0;
  var d=new Date(base);
  while(dstr(d)<=end&&guard++<60){
    var ds=dstr(d);
    if(ds>=semStart()&&!noClassReason(ds))out.push(ds);
    d.setDate(d.getDate()+7);
  }
  return out;
}
function classPassed(ds,endTime){
  var now=new Date();
  var end=new Date(ds+'T'+endTime+':00');
  return end<=now;
}
function sessionHours(ses){
  var m=toMins(ses.end_time)-toMins(ses.start_time);
  return Math.max(1,Math.round(m/60));
}
function isAbsent(sid,ds){return absences.some(function(a){return a.session_id===sid&&a.class_date===ds})}
function absRec(sid,ds){return absences.find(function(a){return a.session_id===sid&&a.class_date===ds})}
/* hours charged for an absence: what was chosen, else the whole block */
function absHours(ses,ds){
  var r=absRec(ses.id,ds);
  if(!r)return 0;
  return r.hours||sessionHours(ses);
}
/* hours an absence costs: what the teacher counted, else the full block */
function courseSessions(cid){return csessions.filter(function(x){return x.course_id===cid})}
function courseStats(cid){
  var c=courses.find(function(x){return x.id===cid});
  var total=(c?c.credits:3)*semWeeks();
  var held=0,abs=0;
  courseSessions(cid).forEach(function(ses){
    var hrs=sessionHours(ses);
    sessionDates(ses).forEach(function(ds){
      if(classPassed(ds,ses.end_time)){held+=hrs;abs+=absHours(ses,ds)}
    });
  });
  held=Math.min(held,total);
  var limit=Math.floor(total*(cfg.absence_limit||25)/100);
  return{total:total,held:held,absent:abs,present:held-abs,
    pct:total?Math.round((total-abs)/total*100):100,
    absPct:total?Math.round(abs/total*100):0,
    limit:limit,left:Math.max(0,limit-abs),risk:abs>=limit?'over':(limit&&abs>=limit-1?'near':'ok')};
}
function allStats(){
  var t=0,h=0,a=0;
  courses.forEach(function(c){var s=courseStats(c.id);t+=s.total;h+=s.held;a+=s.absent});
  return{total:t,held:h,absent:a,pct:t?Math.round((t-a)/t*100):100,absPct:t?Math.round(a/t*100):0};
}
function sessionsOn(ds){

  var start=new Date(semStart()+'T00:00:00'),end=new Date(semStart()+'T00:00:00');

  var d=new Date(ds+'T00:00:00');
  if(d<start||d>end)return [];

  return csessions.filter(function(x){return x.weekday===wd}).sort(function(a,b){return a.start_time<b.start_time?-1:1});

/* weighted grade from everything scored so far */
/* every course is worth 100 marks; each graded item adds to the running total */
function courseGrade(cid){
  var all=eventsFor(cid).filter(function(e){return e.max_score});
  if(!all.length)return null;
  var earned=0,scoredMax=0,planned=0,pending=0;
  all.forEach(function(e){
    planned+=Number(e.max_score);
    if(e.score!=null){earned+=Number(e.score);scoredMax+=Number(e.max_score)}
    else pending+=Number(e.max_score);
  });
  var r=function(n){return Math.round(n*10)/10};
  return{count:all.length,
    earned:r(earned),                       /* marks banked out of 100 */
    planned:r(planned),                     /* marks assigned to items */
    scoredMax:r(scoredMax),                 /* marks already graded */
    pending:r(pending),                     /* graded later */
    unplanned:r(100-planned),
    pct:r(earned)};                         /* course is out of 100 */
}

/* ---------- render ---------- */
function render(){
  renderHeader();renderNav();

  if(tab==='rank'){renderRank();return}
  if(tab==='stats'){renderStats();return}

function renderHeader(){
  var xp=totalXP(),l=lvlOf(xp),base=xpForLvl(l),next=xpForLvl(l+1);

function renderGoals(){

function visible(e){return pFilter==='all'||e.pillar===pFilter}
function setTab(t){

function renderNav(){

  var tabs=[['main',''+px('home',15)+" "+T('main')],['sched',''+px('cal',15)+" "+T('sched')],['stats',''+px('stats',15)+" "+T('stats')]];

function setView(v){view=v;anchor=new Date();selDay=null;
  ['week','month','year'].forEach(function(x){document.getElementById('vt-'+x).classList.toggle('on',x===v)});
  renderSched();
}
function goToday(){anchor=new Date();selDay=null;renderSched()}
function nav(dir){
  if(view==='week')anchor.setDate(anchor.getDate()+7*dir);
  else if(view==='month')anchor.setMonth(anchor.getMonth()+dir);
  else anchor.setFullYear(anchor.getFullYear()+dir);
  selDay=null;renderSched();
}
function locale(){return lang==='ar'?'ar':'en'}

function renderSched(){
  var b=document.getElementById('schedbody'),lbl=document.getElementById('navlbl');
  var h='',i,d,ds,dd,pts,al,days;
  if(view==='week'){
    var st=new Date(anchor);st.setDate(st.getDate()-st.getDay());
    var en=new Date(st);en.setDate(en.getDate()+6);
    lbl.textContent=st.toLocaleDateString(locale(),{month:'short',day:'numeric'})+' \u2013 '+en.toLocaleDateString(locale(),{month:'short',day:'numeric'});
    h='<div class="wk">';
    for(i=0;i<7;i++){
      d=new Date(st);d.setDate(d.getDate()+i);ds=dstr(d);
      var isT=ds===today(),isS=selDay===ds;
      var de=entries.filter(function(e){return e.entry_date===ds&&visible(e)});
      h+='<div class="day'+(isT?' today':'')+(isS&&!isT?' sel':'')+'" data-d="'+ds+'" ondragover="dragOver(event,this)" ondragleave="this.classList.remove(\'dragover\')" ondrop="dropOn(event,\''+ds+'\')" onclick="pick(\''+ds+'\')">';
      h+='<div class="dh">'+WD[lang][d.getDay()]+'</div>';
      h+='<div class="dn">'+d.getDate()+(isT?' '+px('star',11):'')+'</div>';
      if(isFrozen(ds))h+='<div class="frz">'+px('snow',13)+'</div>';
      h+='<div class="dots">'+de.map(function(e){return '<span class="dot '+(e.status==='planned'?'planned':'')+'" style="background:'+PIL[e.pillar].hex+'"></span>'}).join('')+'</div>';
      h+='<div class="list">'+(de.length?de.map(entHtml).join(''):'<div class="empty">'+T('emptyday')+'</div>')+'</div>';
      if(isT||isS)h+='<textarea class="dnote" rows="2" placeholder="'+T('noteph')+'" onclick="event.stopPropagation()" onchange="saveNote(\''+ds+'\',this.value)">'+esc(notes[ds]||'')+'</textarea>';
      h+='<button class="addday" onclick="event.stopPropagation();openAdd(\''+ds+'\')">+ '+T('add')+'</button>';
      h+='</div>';
    }
    h+='</div>';
  }else if(view==='month'){
    var mxp=0;days=new Date(anchor.getFullYear(),anchor.getMonth()+1,0).getDate();
    for(dd=1;dd<=days;dd++)mxp+=dayPoints(dstr(new Date(anchor.getFullYear(),anchor.getMonth(),dd)));
    lbl.textContent=anchor.toLocaleDateString(locale(),{month:'long',year:'numeric'})+' \u00B7 '+mxp+' XP';
    var f=new Date(anchor.getFullYear(),anchor.getMonth(),1);
    h='<div class="mgrid">';
    WD[lang].forEach(function(w){h+='<div class="mh">'+w+'</div>'});
    for(i=0;i<f.getDay();i++)h+='<div></div>';
    for(dd=1;dd<=days;dd++){
      ds=dstr(new Date(anchor.getFullYear(),anchor.getMonth(),dd));
      pts=dayPoints(ds);al=pts===0?0:Math.min(.85,.15+pts/120);
      h+='<div class="mc'+(ds===today()?' today':'')+'" style="background:rgba(79,156,249,'+al+')" onclick="openDayModal(\''+ds+'\')">'+dd+(notes[ds]?'<span class="nt">'+px('exam',11)+'</span>':'')+(isFrozen(ds)?'<span class="nt">'+px('snow',11)+'</span>':'')+'</div>';
    }
    h+='</div>';
  }else{
    lbl.textContent=String(anchor.getFullYear());
    h='<div class="ygrid">';
    for(var m=0;m<12;m++){
      days=new Date(anchor.getFullYear(),m+1,0).getDate();
      h+='<div class="ym"><h4>'+new Date(anchor.getFullYear(),m,1).toLocaleDateString(locale(),{month:'short'})+'</h4><div class="ydays">';
      for(dd=1;dd<=days;dd++){
        ds=dstr(new Date(anchor.getFullYear(),m,dd));
        pts=dayPoints(ds);al=pts===0?0:Math.min(.9,.2+pts/120);
        h+='<div class="yd" style="background:'+(pts?'rgba(52,211,153,'+al+')':'var(--card2)')+'"></div>';
      }
      h+='</div></div>';
    }
    h+='</div>';
  }
  b.innerHTML=h;
}

/* ---------- actions ---------- */
async function toggleDone(id){
  var e=entries.find(function(x){return x.id===id});if(!e)return;
  var ns=e.status==='done'?'planned':'done';
  var r=await dbUpdate('activity_entries',id,{status:ns});
  e.status=ns;saveCache();
  offToast(r,ns==='done'?'+'+e.points_awarded+' XP '+e.title:'\u2212'+e.points_awarded+' XP \u00B7 '+T('backplan'));
  checkLevelUp();render();
}
function delEntry(id){
  var e=entries.find(function(x){return x.id===id});if(!e)return;
  var m=T('delm',{t:esc(e.title),d:e.entry_date})+(e.status==='done'?T('dellost',{p:e.points_awarded}):'');
  confirmBox(T('delq'),m,T('del'),async function(){
    var r=await dbDelete('activity_entries',id);
    entries=entries.filter(function(x){return x.id!==id});saveCache();
    offToast(r,T('deleted')+' \u2014 '+e.title);render();
  });
}
async function togglePrayer(name){
  var td=today();
  var e=entries.find(function(x){return x.entry_date===td&&x.pillar==='soul'&&x.title===name&&x.status==='done'});
  if(e){
    var r=await dbDelete('activity_entries',e.id);
    entries=entries.filter(function(x){return x.id!==e.id});saveCache();
    offToast(r,'\u2212'+e.points_awarded+' XP \u00B7 '+name+' '+T('unlogged'));
  }else{
    var t=types.find(function(x){return x.pillar==='soul'&&x.name===name&&x.active});
    var pts=t?t.points:10;
    var r2=await dbInsert('activity_entries',[{pillar:'soul',title:name,entry_date:td,status:'done',points_awarded:pts,activity_type_id:t?t.id:null}]);
    entries=entries.concat(r2.data);saveCache();
    offToast(r2,'+'+pts+' XP \u00B7 '+name);
  }
  checkLevelUp();render();
}
async function saveNote(ds,v){
  var r=await dbUpsert('day_notes',{user_id:user.id,entry_date:ds,note:v});
  notes[ds]=v;saveCache();offToast(r,T('saved'));
}

/* drag & drop */
var dragId=null;
function dragStart(ev,id){dragId=id;ev.dataTransfer.effectAllowed='move'}
function dragOver(ev,el){ev.preventDefault();el.classList.add('dragover')}
async function dropOn(ev,ds){
  ev.preventDefault();

async function moveEntry(id,ds){

  e.entry_date=ds;saveCache();offToast(r,T('saved')+' \u2192 '+ds);render();
}
function openMove(id){

function drawRadar(){
  var cv=document.getElementById('radar');if(!cv)return;
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H/2+4,R=Math.min(W,H)/2-52;
  ctx.clearRect(0,0,W,H);
  var mx=Math.max.apply(null,PKEYS.map(pillarXP).concat([1]));
  var ang=function(i){return -Math.PI/2+i*Math.PI/2};
  for(var ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(var i=0;i<=4;i++){var a=ang(i%4),r=R*ring/4,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.strokeStyle='rgba(35,47,66,.9)';ctx.stroke();
  }
  for(var i=0;i<4;i++){var a=ang(i);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.strokeStyle='rgba(35,47,66,.9)';ctx.stroke()}
  ctx.beginPath();
  for(var i=0;i<=4;i++){var p=PKEYS[i%4],a=ang(i%4),r=R*(pillarXP(p)/mx),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.fillStyle='rgba(79,156,249,.22)';ctx.fill();ctx.strokeStyle='#4f9cf9';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
  for(var i=0;i<4;i++){
    var p=PKEYS[i],a=ang(i),r=R*(pillarXP(p)/mx);
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,4,0,7);ctx.fillStyle=PIL[p].hex;ctx.fill();
    ctx.fillStyle='#8494ad';ctx.font='12px Segoe UI';ctx.textAlign='center';
    ctx.fillText(pnm(p),cx+Math.cos(a)*(R+26),cy+Math.sin(a)*(R+26)+4);
  }
}
function drawSeason(){
  var cv=document.getElementById('seasonring');if(!cv)return;
  var ctx=cv.getContext('2d'),cx=90,cy=90,R=68;
  ctx.clearRect(0,0,180,180);
  var pct=Math.min(1,seasonXP()/(cfg.season_target||1500));
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='#1a2332';ctx.lineWidth=14;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
  var g=ctx.createLinearGradient(0,0,180,180);g.addColorStop(0,'#fbbf24');g.addColorStop(1,'#f59e0b');
  ctx.strokeStyle=g;ctx.lineWidth=14;ctx.lineCap='round';ctx.stroke();
  ctx.fillStyle='#e8eefb';ctx.font='bold 26px Segoe UI';ctx.textAlign='center';
  ctx.fillText(Math.round(pct*100)+'%',cx,cy+9);
}

  h+='<label>'+T('semstart')+'</label><input id="psem" type="date" value="'+(cfg.semester_start||'2026-08-23')+'">'+
  '<label>'+T('semweeks')+'</label><input id="psemw" type="number" value="'+(cfg.semester_weeks||15)+'">'+
  '<label>'+T('abslimit')+'</label><input id="pabs" type="number" value="'+(cfg.absence_limit||25)+'">';
  h+='<label>'+T('caloriegoal')+'</label><input id="pcal" type="number" value="'+(cfg.calorie_goal||2200)+'">'+
  '<label>'+T('proteingoal')+'</label><input id="pprot" type="number" value="'+(cfg.protein_goal||120)+'">'+
  '<label>'+T('watergoal')+'</label><input id="pwater" type="number" value="'+(cfg.water_goal_ml||2000)+'">'+
  '<label>'+T('bottlesize')+'</label><input id="pbottle" type="number" value="'+(cfg.bottle_ml||250)+'">'+
  '<label>'+T('seasontarget')+'</label><input id="pseason" type="number" value="'+(cfg.season_target||1500)+'">'+
  '<label>'+T('qurangoal')+'</label><input id="pquran" type="number" value="'+(cfg.quran_goal||604)+'">'+
  '<div class="mrow"><button class="no" onclick="closeModal()">'+T('cancel')+'</button><button class="ok" onclick="savePrefs()">'+T('save')+'</button></div>';
  showModal(h);
}
async function savePrefs(){
  var g={};PKEYS.forEach(function(p){g[p]=parseInt(document.getElementById('g_'+p).value)||0});
  var nl=document.getElementById('plang').value;
  var ok=await saveCfg({lang:nl,city:document.getElementById('pcity').value.trim()||'Riyadh',
    country:document.getElementById('pcountry').value.trim()||'Saudi Arabia',goals:g,
    season_target:parseInt(document.getElementById('pseason').value)||1500,
    quran_goal:parseInt(document.getElementById('pquran').value)||604,
    calorie_goal:parseInt(document.getElementById('pcal').value)||2200,
    protein_goal:parseInt(document.getElementById('pprot').value)||120,
    water_goal_ml:parseInt(document.getElementById('pwater').value)||2000,
    bottle_ml:parseInt(document.getElementById('pbottle').value)||250,
    steps_goal:parseInt(document.getElementById('psteps').value)||8000,
    semester_start:document.getElementById('psem').value||'2026-08-23',
    semester_weeks:parseInt(document.getElementById('psemw').value)||15,
    absence_limit:parseInt(document.getElementById('pabs').value)||25});
  if(!ok)return;
  lang=nl;localStorage.setItem('fp_lang',lang);applyLang();
  if(document.getElementById('pcity')){cfg.lat=null;cfg.lon=null;localStorage.removeItem('fp_geo')}
  prayerTimes=null;loadPrayerTimes(true);
  toast(T('saved'));closeModal();render();
}
function openTypes(){
  var h='<h2>'+px('clip',15)+' '+T('manage')+'</h2>';
  PKEYS.forEach(function(p){
    h+='<label>'+px(PIL[p].ic,13)+' '+pnm(p)+'</label>';
    activeTypes(p).forEach(function(t){
      h+='<div class="typerow"><span class="t">'+esc(t.name)+'</span><span class="p">+'+t.points+'</span><button onclick="delType(\''+t.id+'\')" aria-label="delete">'+px('trash',14)+'</button></div>';
    });
  });
  h+='<label>'+T('addnew')+'</label><select id="ntp">'+PKEYS.map(function(p){return '<option value="'+p+'">'+pnm(p)+'</option>'}).join('')+'</select>'+
  '<input id="ntn" placeholder="'+T('actname')+'" style="margin-top:6px"><input id="ntpts" type="number" value="10" style="margin-top:6px">'+
  '<div class="mrow"><button class="no" onclick="closeModal()">'+T('close')+'</button><button class="ok" onclick="addType()">'+T('add')+'</button></div>';
  showModal(h);
}
async function addType(){
  var p=document.getElementById('ntp').value,n=document.getElementById('ntn').value.trim(),pt=parseInt(document.getElementById('ntpts').value)||10;
  if(!n){toast(T('nameFirst'));return}
  var r=await dbInsert('activity_types',[{pillar:p,name:n,points:pt,active:true}]);
  types=types.concat(r.data);saveCache();
  offToast(r,T('added')+' \u2014 '+n);openTypes();
}
function delType(id){
  var t=types.find(function(x){return x.id===id});if(!t)return;
  confirmBox(T('remq'),T('remm',{t:esc(t.name),p:t.points}),T('remove'),async function(){
    var r=await dbUpdate('activity_types',id,{active:false});
    t.active=false;saveCache();
    offToast(r,T('removed')+' \u2014 '+t.name);openTypes();
  });
}

/* ---------- onboarding ---------- */
var obData={};
function onboard(step){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
  var b=document.getElementById('authbox'),h='';
  if(step===0){
    h='<h1>'+px('wave',20)+' '+T('welcome')+'</h1><p>'+T('obtag')+'</p>'+
    '<label style="color:var(--dim);font-size:12px;display:block;margin-bottom:6px">'+T('oblang')+'</label>'+
    '<select id="ob_lang" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--tx);margin-bottom:12px"><option value="en"'+(lang==='en'?' selected':'')+'>English</option><option value="ar"'+(lang==='ar'?' selected':'')+'>\u0627\u0644\u0639\u0631\u0628\u064A\u0629</option></select>'+
    '<button class="main" onclick="obStep(0)">'+T('obnext')+'</button>';
  }else if(step===1){
    h='<h1>'+px('kaaba',26)+'</h1><p>'+T('obcity')+'</p>'+
    '<button class="alt" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px" onclick="obDetect()">'+px('globe',15)+' '+T('autoloc')+'</button>'+
    '<input id="ob_city" value="'+esc(cfg.city)+'" placeholder="'+T('city')+'">'+
    '<input id="ob_country" value="'+esc(cfg.country)+'" placeholder="'+T('country')+'">'+
    '<button class="main" onclick="obStep(1)">'+T('obnext')+'</button>';
  }else{
    h='<h1>'+px('target',26)+'</h1><p>'+T('obgoals')+'</p>';
    PKEYS.forEach(function(p){
      h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="flex:1;font-size:14px">'+px(PIL[p].ic,14)+' '+pnm(p)+'</span>'+
      '<input type="number" min="0" max="7" id="ob_'+p+'" value="'+(cfg.goals[p]||0)+'" style="width:70px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--tx)"></div>';
    });
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="flex:1;font-size:14px">'+px('drop',14)+' '+T('watergoal')+'</span>'+
    '<input type="number" id="ob_water" value="'+(cfg.water_goal_ml||2000)+'" style="width:90px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--tx)"></div>';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="flex:1;font-size:14px">'+px('plate',14)+' '+T('caloriegoal')+'</span>'+
    '<input type="number" id="ob_cal" value="'+(cfg.calorie_goal||2200)+'" style="width:90px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--tx)"></div>';
    h+='<button class="main" style="margin-top:10px" onclick="obStep(2)">'+T('obdone')+'</button>';
  }
  b.innerHTML=h;
}
async function obDetect(){
  var ok=await detectLocation(false);
  if(ok){
    try{var g=JSON.parse(localStorage.getItem('fp_geo')||'null');
      if(g){document.getElementById('ob_city').value=g.city||'';document.getElementById('ob_country').value=g.country||''}
    }catch(e){}
  }
}
async function obStep(step){
  if(step===0){lang=document.getElementById('ob_lang').value;localStorage.setItem('fp_lang',lang);applyLang();onboard(1)}
  else if(step===1){obData.city=document.getElementById('ob_city').value.trim()||'Riyadh';obData.country=document.getElementById('ob_country').value.trim()||'Saudi Arabia';onboard(2)}
  else{
    var g={};PKEYS.forEach(function(p){g[p]=parseInt(document.getElementById('ob_'+p).value)||0});
    var wEl=document.getElementById('ob_water'),cEl=document.getElementById('ob_cal');
    await saveCfg({lang:lang,city:obData.city,country:obData.country,goals:g,onboarded:true,season_start:today(),
      water_goal_ml:(wEl?parseInt(wEl.value):0)||2000,calorie_goal:(cEl?parseInt(cEl.value):0)||2200});
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();loadPrayerTimes();toast(T('welcome'),'bolt');
  }
}

/* ---------- swipe ---------- */
var tsX=0,tsY=0;
document.addEventListener('touchstart',function(e){
  if(!e.target.closest('#schedbody'))return;
  tsX=e.changedTouches[0].clientX;tsY=e.changedTouches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!e.target.closest('#schedbody'))return;
  var dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){
    var dir=dx<0?1:-1;
    if(lang==='ar')dir=-dir;
    nav(dir);
  }
},{passive:true});

/* ---------- PWA ---------- */
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install').classList.remove('hidden');
});
async function doInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('install').classList.add('hidden');
  toast(T('installed'));
}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});

/* ---------- boot ---------- */
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY')showRecover()});
applyLang();renderAuth();
if(location.hash.indexOf('type=recovery')>=0)showRecover();else init();
</script>
</body>
</html>
